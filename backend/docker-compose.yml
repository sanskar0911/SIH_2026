version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tc_intel_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tc_intel
      - REDIS_URL=redis://redis:6379/0
      - MOCK_DATA_MODE=true
      - GPU_ENABLED=false
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgis/postgis:16-3.4
    container_name: tc_intel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tc_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tc_intel_redis
    restart: always
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tc_intel_worker
    restart: always
    command: python -m app.workers.analysis_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tc_intel
      - REDIS_URL=redis://redis:6379/0
      - MOCK_DATA_MODE=true
    depends_on:
      - backend
      - postgres
      - redis

volumes:
  postgres_data:
