services:
  - type: web
    name: sih-2026-cyclone-intelligence
    env: python
    region: singapore
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK_DATA_MODE
        value: "true"
      - key: MOSDAC_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONPATH
        value: "backend"
